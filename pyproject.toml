[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "csv_sorter"                # 包名，pip install 时使用
version = "0.1.0"
description = "A small tool to sort CSV files by the second column"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "JIFR", email = "your@email.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "pandas"                       # 运行依赖
]

[project.scripts]
csv-sort = "csv_sorter.process:main"   # 命令 = 模块:函数

[project.urls]
Homepage = "https://github.com/ChenLinLinC/csv_sorter"
Issues = "https://github.com/ChenLinLinC/csv_sorter/issues"